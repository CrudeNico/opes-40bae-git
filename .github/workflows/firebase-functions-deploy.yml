name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/firebase-functions-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: FirebaseExtended/action-setup-firebase@v0

      - name: Set Resend API secret
        run: |
          printf '%s' "${{ secrets.VITE_RESEND_API_KEY }}" | firebase functions:secrets:set RESEND_API_KEY --project opes-40bae --force

      - name: Deploy functions
        run: firebase deploy --only functions:sendResendEmail --project opes-40bae --non-interactive
