name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/firebase-functions-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write function environment
        run: |
          cat > functions/.env.opes-40bae <<EOF
          RESEND_API_KEY=${{ secrets.VITE_RESEND_API_KEY }}
          RESEND_SENDER_EMAIL=${{ secrets.VITE_RESEND_SENDER_EMAIL }}
          RESEND_SENDER_NAME=${{ secrets.VITE_RESEND_SENDER_NAME }}
          EOF

      - name: Deploy functions
        run: firebase deploy --only functions:sendResendEmail --project opes-40bae --non-interactive
